<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お手本の声チェック</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px 16px 80px; background: #fafaf7; color: #222; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select, button { font-size: 16px; padding: 6px 10px; }
  .unit { margin: 16px 0 6px; font-weight: bold; color: #555; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #e4e2dc; }
  .row.bad { background: #ffe9e6; }
  .row { flex-wrap: wrap; }
  .note { display: none; width: 100%; margin: 4px 0 0 54px; }
  .row.bad .note { display: block; }
  .note input { width: calc(100% - 70px); font-size: 15px; padding: 6px; }
  .row.cur { outline: 2px solid #4a7; }
  .w { font-size: 20px; min-width: 6em; }
  .y { color: #777; flex: 1; }
  .w.s { font-size: 16px; min-width: 0; flex: 3; }
  .play { width: 44px; height: 40px; }
  .ok, .ng { font-size: 15px; padding: 6px 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; }
  .row.isok .ok { background: #2e8b57; color: #fff; border-color: #2e8b57; }
  .row.bad .ng { background: #c0392b; color: #fff; border-color: #c0392b; }
  .row.isok { background: #eaf6ee; }
  .none { color: #b55; font-size: 13px; }
  #out { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ccc; padding: 8px 16px; display: flex; gap: 8px; align-items: center; }
  #out span { flex: 1; font-size: 13px; }
  #out button { font-size: 15px; padding: 8px 10px; }
</style>
</head>
<body>
<h1>お手本の声チェック</h1>
<p style="margin:0 0 8px;font-size:14px;color:#555">声のある単語・例文を並べています（上で切りかえ）。★要確認は、AIの聞き取りで読みを確かめきれなかった語です。下の「▶ 連続再生」で全部を順に流します。どの語の▶を押しても、そこから続けて流れます。流れた語には自動で○が付くので、変な発音だったら×を押して、何がダメかを書いてください。印はこの端末に残ります。</p>
<div class="bar">
  <select id="lv"><option value="n5">N5 単語</option><option value="n4">N4 単語</option><option value="n3">N3 単語</option><option value="n2">N2 単語</option>
    <option value="spot">抜き打ち 例文20</option><option value="chkex">★要確認の例文</option>
    <option value="n5ex">N5 例文</option><option value="n4ex">N4 例文</option><option value="n3ex">N3 例文</option><option value="n2ex">N2 例文</option></select>
</div>
<div id="list"></div>
<div id="out"><button id="all">▶ 連続再生</button><button id="stop">■ 停止</button><span id="cnt"></span><button id="copy">×をコピー</button></div>
<script type="module">
import { VOCAB } from "./vocab.js?v=202610251201";
// 声の一覧は毎回いちばん新しいものを読む（古い一覧のまま印を付けないように）
const { VOICE, VOICE_CHECK } = await import("./voice.js?t=" + Date.now());
const $ = id => document.getElementById(id);
const KEY = "voicecheck_marks2";
let marks = {};   // 声のファイル名 → "ok" | "ng"（声を作り直したら印は消える）
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const saveMarks = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch {} };
const audio = new Audio();
let rows = [], playing = false;

function play(v, row) {
  return new Promise(res => {
    rows.forEach(r => r.classList.remove("cur")); row.classList.add("cur");
    row._auto && row._auto();   // 再生したら○（まだ印がないときだけ）
    if (!VOICE[row._key]) return res();
    audio.src = "voice/" + VOICE[row._key];
    audio.onended = audio.onerror = () => res();
    audio.play().catch(() => res());
  });
}
function render() {
  const sel = $("lv").value, ex = sel.endsWith("ex"), lv = sel.replace("ex", ""), list = $("list");
  list.innerHTML = ""; rows = [];
  if (sel === "spot" || sel === "chkex") {   // 例文をレベルをまたいで選ぶ
    const all = VOCAB.flatMap(v => v.ex.map(e => [v, e.ja])).filter(([, k]) => VOICE[k]);
    let pick;
    if (sel === "chkex") pick = all.filter(([, k]) => VOICE_CHECK.includes(k));
    else {   // 毎回同じ20文（決まった順の乱数）
      let x = 20261025; const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
      const pool = all.filter(([, k]) => !VOICE_CHECK.includes(k));
      pick = Array.from({ length: 20 }, () => pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
    }
    for (const [v, k] of pick) addRow(v, k, true, list);
    count(); return;
  }
  const vs = VOCAB.filter(v => v.id.startsWith(lv + "-"));
  vs.forEach((v, i) => {
    if (i % 20 === 0) { const u = document.createElement("div"); u.className = "unit"; u.textContent = `ユニット${i / 20 + 1}`; list.append(u); }
    // 単語なら単語1つ、例文ならその単語の例文を並べる
    for (const key of ex ? v.ex.map(e => e.ja) : [v.word]) addRow(v, key, ex, list);
  });
  [...list.querySelectorAll(".unit")].forEach(u => { const n = u.nextElementSibling; if (!n || n.classList.contains("unit")) u.remove(); });
  count();
}
function addRow(v, key, ex, list) {
    if (!VOICE[key]) return;   // 声のないものは出さない
    const r = document.createElement("div");
    const f = VOICE[key];
    const paint = () => { r.className = "row" + (marks[f] === "ok" ? " isok" : marks[f] === "ng" ? " bad" : ""); };
    r.innerHTML = `<button class="play">▶</button><span class="w"></span><span class="y"></span><button class="ok">○</button><button class="ng">×</button>` +
      `<div class="note"><input placeholder="何がダメ？（例：「ふって」の上がり下がり、読みがちがう、区切り）"></div>`;
    const memo = r.querySelector(".note input");
    memo.value = marks[f + "#memo"] || "";
    memo.oninput = () => { if (memo.value.trim()) marks[f + "#memo"] = memo.value.trim(); else delete marks[f + "#memo"]; saveMarks(); };
    r.querySelector(".w").textContent = ex ? key.replace(/ /g, "") : v.word;
    if (ex) r.querySelector(".w").classList.add("s");
    r.querySelector(".y").textContent = (ex ? "" : v.reading) + (VOICE_CHECK.includes(key) ? "　★要確認" : "") + (/[ge][0-9]?[.]mp3$/.test(f) ? "" : "　（前の声）");
    r.querySelector(".play").onclick = () => playFrom(rows.indexOf(r));   // その語から続けて再生
    const set = m => { if (marks[f] === m) delete marks[f]; else marks[f] = m; marks[f] && (marks[f + "#w"] = key); saveMarks(); paint(); count(); };
    r._auto = () => { if (!marks[f]) set("ok"); };
    r.querySelector(".ok").onclick = () => set("ok");
    r.querySelector(".ng").onclick = () => set("ng");
    paint();
    r._v = v; r._key = key; rows.push(r); list.append(r);
}
function count() {
  const all = Object.keys(VOICE).length, v = Object.entries(marks).filter(([k]) => !k.includes("#") && VOICE[marks[k + "#w"]] === k).map(([, m]) => m);
  $("cnt").textContent = `声 ${all}件 ／ ○${v.filter(m => m === "ok").length} ×${v.filter(m => m === "ng").length}`;
}
$("lv").onchange = render;
let run = 0;   // 再生の回。新しく始めたら前の連続再生は止まる
async function playFrom(start) {
  const me = ++run; playing = true; audio.pause();
  for (let i = start; i < rows.length && playing && run === me; i++) {
    rows[i].scrollIntoView({ block: "center", behavior: "smooth" });
    await play(rows[i]._v, rows[i]);
    if (run !== me) return;
    await new Promise(r => setTimeout(r, /ex|spot/.test($("lv").value) ? 600 : 250));
  }
  if (run === me) playing = false;
}
$("all").onclick = () => playFrom(Math.max(0, rows.findIndex(r => r.classList.contains("cur"))));
$("stop").onclick = () => { playing = false; run++; audio.pause(); };
$("copy").onclick = async () => {
  // コピーする直前に、いちばん新しい声の一覧を読み直す（作り直した声に付いていた古い×は出さない）
  try { Object.assign(VOICE, (await import("./voice.js?t=" + Date.now())).VOICE); } catch {}
  // 今の声の印だけ（作り直す前の声の×は出さない）
  const t = Object.keys(marks).filter(k => marks[k] === "ng" && VOICE[marks[k + "#w"]] === k)
    .map(k => marks[k + "#w"].replace(/ /g, "") + (marks[k + "#memo"] ? `【${marks[k + "#memo"]}】` : "")).join(" ／ ") || "（なし）";
  try { await navigator.clipboard.writeText(t); $("copy").textContent = "コピーしました"; }
  catch { prompt("この文をコピーしてください", t); }
};
render();
</script>
</body>
</html>
