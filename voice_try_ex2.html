<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>例文のアクセント直し</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:12px 16px;background:#fafaf7;color:#222}h1{font-size:20px}p{font-size:13px;color:#555}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e4e2dc;padding:8px 4px;text-align:center}th{font-size:12px;color:#555;font-weight:normal}td.t{text-align:left;font-size:14px}button{font-size:18px;width:46px;height:40px}</style></head><body>
<h1>例文のアクセント直し（試し）</h1>
<p>「雨がふっていますから、かさを持って行きます。」の「ふって」（正しくは ふ↘って）を、3つのやり方で読ませました。</p>
<table><tr><th>やり方</th><th>Chirp3 Aoede</th><th>Neural2-B</th></tr>
<tr><td class="t">① そのまま（今の例文の書き方）</td><td><button onclick="p('voice_try/ex2/1_Chirp3-HD-Aoede.mp3')">▶</button></td><td><button onclick="p('voice_try/ex2/1_Neural2-B.mp3')">▶</button></td></tr>
<tr><td class="t">② 漢字にして読ませる（雨が降っていますから、傘を…）</td><td><button onclick="p('voice_try/ex2/2_Chirp3-HD-Aoede.mp3')">▶</button></td><td><button onclick="p('voice_try/ex2/2_Neural2-B.mp3')">▶</button></td></tr>
<tr><td class="t">③ 「ふって」の下がる位置を指定（フ'ッテ）</td><td><button onclick="p('voice_try/ex2/3_Chirp3-HD-Aoede.mp3')">▶</button></td><td><button onclick="p('voice_try/ex2/3_Neural2-B.mp3')">▶</button></td></tr>
</table>
<script>const a=new Audio();function p(s){a.src=s;a.play()}</script></body></html>
